<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers and Identity</title>
    <style>
        .highlight{
            background-color: oklab(90.54100000000001% -0.14945 -0.0395);
        }
        #site-footer{
            color:chartreuse;
        }
        .card{
            border: 2px solid #94A3B8;
            border-radius: 8px
        }
        #main-nav{
            background: navy;
            color: white;
        }
        .price{
            color:rgb(11, 137, 19);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav id="main-nav">...nav links...</nav>
    <p class="highlight">First Note</p>
    <p class="highlight">Second Note</p>
    <p class="highlight">Third Note</p>
<p>A plain note - no class, no color</p>
    <!-- (div.card>h2+p)*2 -->
    <div class="highlight">
        <h2>Product A</h2>
        <p>First Product</p>
    </div>
    <div class="card">
        <h2>Product B</h2>
        <p>Second Product</p>
    </div>
    <p>The price is <span class="price">$29</span> today only!</p>

    <footer id="site-footer">
        @ 2026 CLUB SIGN-UP
    </footer>
</body>
</html>
